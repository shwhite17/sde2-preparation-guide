<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SDE2 Prep Tracker</title>
<style>
:root{
  --bg:#0e1420; --panel:#161f30; --panel2:#1c2740; --line:#2a3652;
  --ink:#e7ecf5; --ink-dim:#9aa7bf; --accent:#5eead4; --accent-ink:#06201b;
  --amber:#f5b942; --done:#4ade80; --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f7fb; --panel:#ffffff; --panel2:#eef1f8; --line:#dde3f0;
    --ink:#161d2c; --ink-dim:#5b6478; --accent:#0e9488; --accent-ink:#ffffff;
    --amber:#b4740e; --done:#178a4c;
  }
}
:root[data-theme="dark"]{ --bg:#0e1420; --panel:#161f30; --panel2:#1c2740; --ink:#e7ecf5; }
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 60px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--ink-dim);font-size:13px;margin-top:3px}
button{font:inherit;cursor:pointer;border:none}
.icon-btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px}
.icon-btn:active{transform:translateY(1px)}

.setup{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center}
.setup p{color:var(--ink-dim);margin:6px 0 16px;font-size:14px}
.setup input[type=date]{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:15px}
.setup .go{margin-top:14px;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:10px 18px;font-weight:600}

.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.bar{flex:1;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pct{font-size:12px;color:var(--ink-dim);white-space:nowrap}

.weekstrip{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.dot{flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-dim);position:relative}
.dot.today{border-color:var(--accent);color:var(--accent);font-weight:700}
.dot.complete{background:var(--done);color:#08240f;border-color:var(--done)}
.dot.complete.today{outline:2px solid var(--accent);outline-offset:1px}

.navrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.navrow .mid{text-align:center}
.navrow .mid b{font-size:16px}
.navrow .mid span{display:block;color:var(--ink-dim);font-size:12px;margin-top:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card.review{border-left:3px solid var(--amber)}
.card .tag{font-size:11px;color:var(--ink-dim);margin-bottom:4px}
.card .time{color:var(--ink-dim)}

.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:none;padding-top:2px}
.task input[type=checkbox]{width:20px;height:20px;margin-top:1px;accent-color:var(--done);flex:0 0 auto}
.task .body{flex:1;min-width:0}
.task .label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);margin-bottom:3px}
.task .time{font-size:11px;color:var(--ink-dim);margin-bottom:4px}
.task .txt{font-size:14.5px}
.task.checked .txt{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:var(--line)}

.foot{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.foot button{flex:1;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px}
.foot button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.resetline{text-align:center;margin-top:22px}
.resetline button{background:none;color:var(--ink-dim);font-size:12px;text-decoration:underline}
.done-banner{text-align:center;padding:40px 16px;color:var(--ink-dim)}
.done-banner b{color:var(--done);display:block;font-size:20px;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ---------- Plan data: [dsa, designProblem, supportTrack, revision] ----------
const TIMES = ["09:00–12:00","12:30–16:30","17:00–20:00","20:30–22:30"];
const LABELS = ["DSA","Design Problem (LLD/HLD)","Java / Spring / Scalability","Revision"];
const WEEKS = [
 {t:"Week 1 — LLD Foundations Through Practice", f:"LLD · Patterns + Core Java", days:[
  ["Arrays & Hashing — revise + 4 problems","Design a Logging Framework — apply Singleton + Builder","Java OOPs deep dive: 4 pillars, SOLID, abstract vs interface, final/static/this/super","Cheat sheet: SOLID + Singleton/Builder code"],
  ["Two Pointers & Sliding Window — 5 problems","Design a Vending Machine — State + Strategy (payment methods)","Collections Framework: HashMap internals, List/Set/Map, Comparable vs Comparator","Redo State + Strategy from memory"],
  ["Stacks & Queues — 5 problems","Design a Notification System — Observer + Strategy (email/SMS/push)","Exception handling: checked vs unchecked, custom exceptions, try-with-resources","Redo Observer + Strategy from memory"],
  ["Linked List — reverse, cycle, merge (5 problems)","Design a Parking Lot — thread-safe slot allocation","Concurrency: threads, synchronized, race conditions, volatile","Cheat sheet: synchronized vs volatile vs Atomic*"],
  ["Binary Search + variants — 5 problems","Design an Elevator System — multi-elevator scheduling","Concurrency: ExecutorService, thread pools, Future/CompletableFuture","Note: state machine design for elevator states"],
  ["Recursion & Backtracking basics — 4 problems","Design a Rate Limiter (token bucket, in Java)","Spring Boot intro: IoC/DI, @Component/@Service/@Repository/@Autowired","Cheat sheet: rate-limiting algorithms + Spring DI basics"],
  ["Redo 3 hardest problems from this week, timed","Re-code your 2 weakest LLD problems, cold, 60 min each","Redo Java OOPs + Collections Q&A cold, no notes","Consolidate Week 1 notes into master doc"]
 ]},
 {t:"Week 2 — LLD Set 2", f:"Caching, Booking Systems, Concurrency-Heavy", days:[
  ["Binary Trees: traversals, depth, diameter — 5 problems","Design an LRU Cache from scratch (no LinkedHashMap) + LFU extension","HashMap + Doubly Linked List pattern deep dive, ConcurrentHashMap internals","Note: HashMap + DLL pattern written from memory"],
  ["Binary Search Trees — 5 problems","Design Splitwise / Expense Sharing System","Spring Boot: REST controller basics, @RestController, request/response lifecycle","Note: graph-based debt simplification approach"],
  ["Heaps / Priority Queue — 5 problems","Design a Movie Ticket Booking System — prevent double-booking of same seat","Spring Data JPA — repositories, entity mapping, @Transactional","Note: locking strategy for seat booking (optimistic vs pessimistic)"],
  ["Graphs: BFS/DFS — 5 problems","Design a Car Booking/Rental System (Uber's actual asked question)","Exception handling (@ControllerAdvice), validation (@Valid)","Note: Strategy pattern for pricing/booking rules"],
  ["Graphs: Topological Sort + Union-Find — 5 problems","Design Snake Game (Atlassian's actual asked question)","Java Streams API: map/filter/reduce/collect","Note: how interviewer probed edge cases — anticipate similar"],
  ["Graphs: Dijkstra + shortest path — 4 problems","Design a Library Management System — reservation queue for checked-out books","Spring Boot caching with @Cacheable","Note: OOD class diagram for this system"],
  ["Redo 3 hardest graph/tree problems, timed","Re-code your 2 weakest LLD problems from this week, cold","Redo Spring Boot Q&A cold: DI, JPA, transactions","Consolidate Week 2 — 12 LLD problems solved so far"]
 ]},
 {t:"Week 3 — LLD Set 3", f:"State Machines, Scheduling, Composite + DP", days:[
  ["DP 1D: climbing stairs, house robber, decode ways — 4 problems","Design an In-Memory Key-Value Store (with TTL, thread-safe)","ScheduledExecutorService for TTL expiry, BlockingQueue producer-consumer full impl","Note: locking granularity trade-offs"],
  ["DP 2D grids: unique paths, min path sum — 4 problems","Design a Meeting Room / Calendar Scheduler — conflict detection, interval overlap","ReentrantLock vs synchronized, ReadWriteLock use cases","Note: interval-overlap algorithm reused from DSA block"],
  ["DP Knapsack variants — 4 problems","Design a Hotel Booking System","Thread-safe Singleton (double-checked locking)","Note: entity relationships (Room, Booking, Guest, Payment)"],
  ["DP LIS/LCS — 4 problems","Design a Food Delivery System (order state machine: placed → preparing → out for delivery → delivered)","Deadlock detection/prevention, thread dump reading basics","Note: state machine diagram for order lifecycle"],
  ["Greedy algorithms — 4 problems","Design a Chess Game (or Tic-Tac-Toe) — heavy OOD, class hierarchy","CompletableFuture chaining, parallel streams","Note: class hierarchy diagram (Piece → King/Queen/etc.)"],
  ["Intervals: merge, insert, meeting rooms — 4 problems","Design a File System (in-memory directory structure) — Composite pattern","Optimistic vs pessimistic locking (in-code and DB-level)","Note: Composite pattern applied to File/Directory"],
  ["Redo 3 hardest DP problems, timed","Re-code your 2 weakest LLD problems from this week, cold, 60 min each","Redo producer-consumer + thread-safe Singleton cold","Consolidate Week 3 — 18 LLD problems solved so far"]
 ]},
 {t:"Week 4 — LLD Set 4", f:"Advanced Patterns + Transition to HLD", days:[
  ["Trie: implement + word search — 4 problems","Design a Cache with Pluggable Eviction Policies (Strategy: LRU/LFU/FIFO)","Mini REST API for this using Spring Boot (controller + service + repository)","Note: Strategy pattern applied to eviction"],
  ["Bit Manipulation — 4 problems","Design a Ride-Matching System — LLD level (driver-rider matching, single-node)","Java @Async for non-blocking dispatch","Note: bridges directly into Week 5's Uber HLD problem"],
  ["Advanced Graphs: MST (Kruskal/Prim), Bellman-Ford — 4 problems","Design a Distributed Lock (LLD/algorithmic level) — Rubrik's concurrency focus","Garbage collection basics (what interviewers expect you to know)","Note: lease-based locking, TTL-based lock expiry"],
  ["Segment Tree / Fenwick Tree basics — 3 problems","Design an Online Auction System — bidding, notification, concurrency on bid updates","Spring Boot logging (Logback/SLF4J) config basics","Note: Observer pattern applied to bid notifications"],
  ["Sliding Window advanced + Two Heaps — 4 problems","Design a URL Shortener — LLD level (encoding/decoding logic, collision handling)","Java Streams + Optional best practices","Note: bridges directly into Week 5's HLD URL Shortener"],
  ["Timed mixed DSA set: 4 medium problems, 90 min total","Consolidation: redo any 2 problems from Weeks 1–3 cold, full timed session","Spring Boot + Java rapid Q&A self-quiz (15 questions, no notes)","Finalize personal LLD reference repo — 23 problems total"],
  ["Redo 3 hardest problems from Weeks 3–4 combined, timed","Full LLD review: redo your 3 weakest problems from the entire month, back to back, timed","Light HLD primer (30 min only): scalability basics, load balancers, CAP theorem","Month 1 complete — LLD is now your strength, not your gap"]
 ]},
 {t:"Week 5 — HLD Set 1", f:"Scalability + DSA Maintenance", days:[
  ["3 medium problems, timed","Design a URL Shortener (full HLD — builds on Week 4's LLD version)","Horizontal vs vertical scaling, stateless services & session management at scale","Diagram + write-up in HLD notebook"],
  ["3 medium problems, timed","Design a Distributed Rate Limiter (builds on Week 1's LLD version)","DB scaling: read replicas, connection pooling, sharding triggers","Diagram + write-up"],
  ["3 medium problems, timed","Design Twitter/Instagram News Feed","Fan-out on write vs read, hot-key/celebrity problem, caching layers","Diagram + write-up"],
  ["3 medium problems, timed","Design WhatsApp/Chat System","Scaling WebSocket connections, presence service at scale","Light LLD redo: weakest problem from Week 1, 45 min"],
  ["3 medium problems, timed","Design Uber Ride-Matching System (builds on Week 4's LLD version)","Geospatial indexing at scale (geohashing/quadtree)","Diagram + write-up"],
  ["3 medium problems, timed","Design a Distributed Cache (Redis-like)","Consistent hashing at scale, cache stampede prevention, replication lag","Light LLD redo: weakest problem from Week 2, 45 min"],
  ["Redo 2 hardest DSA problems, timed","Re-explain (out loud, no notes) your 2 weakest HLD designs this week","Re-derive 2 scalability trade-off discussions cold","Consolidate Week 5 HLD notebook"]
 ]},
 {t:"Week 6 — HLD Set 2", f:"Scalability + DSA Maintenance", days:[
  ["3 medium problems, timed","Design a Push Notification System at Scale (builds on Week 1's LLD)","Fan-out at scale, retry/backoff, queue-based buffering","Diagram + write-up"],
  ["3 medium problems, timed","Design a Web Crawler","Distributed crawling coordination, dedup at scale (Bloom filters)","Light LLD redo: weakest problem from Week 3, 45 min"],
  ["3 medium problems, timed","Design YouTube / Video Streaming Platform","Transcoding pipeline scaling, CDN edge caching, storage tiering","Diagram + write-up"],
  ["3 medium problems, timed","Design a Distributed File Storage System (builds on Week 3's LLD File System)","Chunking + parallel upload/download at scale, metadata service scaling","Diagram + write-up"],
  ["3 medium problems, timed","Design Search Autocomplete/Typeahead","Trie at scale (sharded tries), ranking under high QPS","Light LLD redo: weakest problem from Week 4, 45 min"],
  ["3 medium problems, timed","Design a Payment/Ledger System","Idempotency at scale, distributed transactions (Saga pattern)","Diagram + write-up"],
  ["Redo 2 hardest DSA problems, timed","Re-explain (out loud, no notes) your 2 weakest HLD designs this week","Re-derive 2 scalability discussions cold","Consolidate Week 6 — 12 HLD + 23 LLD problems total"]
 ]},
 {t:"Week 7 — Consolidation + Resume + Behavioral", f:"No new topics — pure re-execution", days:[
  ["3 medium problems, timed","Redo weakest LLD problem cold, 60 min","Resume deep dive: for every project/tech — problem solved, your contribution, one hard decision, one thing you'd change","Update cheat sheet gaps found"],
  ["3 medium problems, timed","Redo weakest HLD problem cold, 60 min","Resume-based: whiteboard architecture of most complex past project from memory; anticipate 'why X over Y'","Refine architecture diagram of that project"],
  ["3 medium problems, timed","Redo second-weakest LLD problem cold, 60 min","Write 2 STAR stories (ownership, conflict) — Atlassian Values round prep","Refine stories for clarity/brevity"],
  ["3 medium problems, timed","Redo second-weakest HLD problem cold, 60 min","Google 'Googleyness & Leadership' prep; 2 STAR stories (ambiguity, collaboration)","Refine stories"],
  ["3 medium problems, timed","Redo a 3rd LLD problem cold, 60 min","Uber-specific: redo ride-matching HLD with concurrency/scale angle; 1 STAR story (production issue)","Resume final polish pass"],
  ["3 medium problems, timed","Redo a 3rd HLD problem cold, 60 min","Rubrik-specific: redo 1 concurrency-heavy LLD problem explicit; Microsoft-specific: OOD round style redo","Write 2 STAR stories (failure, leadership)"],
  ["Light: 2 problems only","Redo your single weakest LLD + single weakest HLD, back to back","Full resume Q&A dry run: read resume line by line, answer every likely follow-up out loud","Full cheat-sheet review: SOLID, patterns, Java, Spring Boot, concurrency, HLD framework, scalability, all 7 STAR stories, resume Q&A"]
 ]},
 {t:"Week 8 — Final Taper", f:"Sharpen, don't cram. Protect sleep.", days:[
  ["2 easy/medium problems","Atlassian-pattern LLD redo (rate limiter or snake game style), 60 min","Resume Q&A: rapid-fire self-quiz on every bullet point","Resume + LinkedIn final check"],
  ["2 easy/medium problems","Uber/Google-pattern HLD redo (ride-matching or scalable service), 60 min","Review negotiation numbers/comp bands for these 5 companies","—"],
  ["2 easy/medium problems","Rubrik-pattern LLD redo (concurrency-focused), 60 min","Java/Spring Boot rapid Q&A self-quiz (20 questions, no notes)","Re-read all 7 STAR stories aloud once"],
  ["2 easy/medium problems","Microsoft-pattern OOD redo, 60 min","Scalability rapid Q&A self-quiz (10 trade-off questions, no notes)","Comp/negotiation prep: know your numbers cold"],
  ["2 easy/medium problems","—","Full LLD problem, hardest in your bank, single timed 90-min run","Note any final gaps"],
  ["2 easy/medium problems","—","Full HLD problem, hardest in your bank, single timed 90-min run","Note any final gaps"],
  ["None — rest","Light re-read of cheat sheet only, no new problems","Light re-read of HLD/LLD notebook + resume Q&A notes only","Sleep. You're ready."]
 ]}
];
const TOTAL_DAYS = WEEKS.length*7; // 56

// ---------- storage ----------
const SK = "sde2_start_date", PK = "sde2_progress";
function loadJSON(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function saveJSON(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function daysBetween(a,b){ const A=new Date(a+"T00:00:00"), B=new Date(b+"T00:00:00"); return Math.round((B-A)/86400000); }

let startDate = loadJSON(SK, null);
let progress = loadJSON(PK, {}); // { "0": [bool,bool,bool,bool], ... } index = day-1
let viewIndex = null; // 0-based day index currently viewed

function dayInfo(idx){ const w=Math.floor(idx/7), d=idx%7; return {week:WEEKS[w], w, d, isReview:d===6}; }
function checks(idx){ return progress[idx] || [false,false,false,false]; }
function setCheck(idx, taskI, val){
  const c = checks(idx).slice(); c[taskI]=val; progress[idx]=c; saveJSON(PK, progress); render();
}
function completedCount(){ return Object.values(progress).filter(c=>c && c.every(Boolean)).length; }

function render(){
  const app = document.getElementById("app");
  if(!startDate){
    app.innerHTML = `
      <div class="wrap">
        <header><div><h1>SDE2 Prep Tracker</h1><div class="sub">Microsoft · Atlassian · Rubrik · Google · Uber</div></div></header>
        <div class="setup">
          <b>When is / was Day 1?</b>
          <p>Pick your start date and this becomes your day-by-day study reminder — 8 weeks, 56 days, four focused blocks a day.</p>
          <input type="date" id="startInput" value="${todayISO()}">
          <div><button class="go" id="startBtn">Start the plan</button></div>
        </div>
      </div>`;
    document.getElementById("startBtn").onclick = () => {
      startDate = document.getElementById("startInput").value || todayISO();
      saveJSON(SK, startDate);
      viewIndex = clampIdx(daysBetween(startDate, todayISO()));
      render();
    };
    return;
  }

  const rawToday = daysBetween(startDate, todayISO());
  if(viewIndex===null) viewIndex = clampIdx(rawToday);
  const idx = viewIndex;

  if(idx >= TOTAL_DAYS){
    app.innerHTML = `<div class="wrap">
      <header><div><h1>SDE2 Prep Tracker</h1></div>
      <button class="icon-btn" id="resetBtn">Reset</button></header>
      <div class="done-banner"><b>All 56 days complete.</b>You've cleared the full 8-week plan. Go get the offer.</div>
      <div class="resetline"><button id="resetBtn2">Start a new cycle</button></div>
    </div>`;
    document.getElementById("resetBtn").onclick = doReset;
    document.getElementById("resetBtn2").onclick = doReset;
    return;
  }

  const info = dayInfo(idx);
  const c = checks(idx);
  const isToday = idx===rawToday;
  const dayNum = idx+1;

  // week strip for the current week
  const weekStart = info.w*7;
  let strip = "";
  for(let i=0;i<7;i++){
    const di = weekStart+i;
    const done = progress[di] && progress[di].every(Boolean);
    const isT = di===rawToday;
    strip += `<button class="dot ${isT?"today":""} ${done?"complete":""}" data-goto="${di}">${i===6?"Rev":"D"+(i+1)}</button>`;
  }

  let tasks = "";
  for(let t=0;t<4;t++){
    const val = info.week.days[info.d][t];
    tasks += `
      <label class="task ${c[t]?"checked":""}">
        <input type="checkbox" data-task="${t}" ${c[t]?"checked":""}>
        <div class="body">
          <div class="label">${LABELS[t]}</div>
          <div class="time">${TIMES[t]}</div>
          <div class="txt">${val}</div>
        </div>
      </label>`;
  }

  const pct = Math.round((completedCount()/TOTAL_DAYS)*100);

  app.innerHTML = `
    <div class="wrap">
      <header>
        <div><h1>SDE2 Prep Tracker</h1><div class="sub">${info.week.t}</div></div>
        <button class="icon-btn" id="todayBtn">Today</button>
      </header>

      <div class="progress-row">
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="pct">${completedCount()}/${TOTAL_DAYS} days · ${pct}%</div>
      </div>

      <div class="weekstrip">${strip}</div>

      <div class="navrow">
        <button class="icon-btn" id="prevBtn" ${idx===0?"disabled":""}>← Prev</button>
        <div class="mid"><b>Day ${dayNum}${info.isReview?" · Review":""}</b><span>${info.week.f}</span></div>
        <button class="icon-btn" id="nextBtn" ${idx===TOTAL_DAYS-1?"disabled":""}>Next →</button>
      </div>

      <div class="card ${info.isReview?"review":""}">
        ${tasks}
      </div>

      ${!isToday?`<div class="foot"><button class="primary" id="jumpTodayBtn">Jump to today (Day ${clampIdx(rawToday)+1})</button></div>`:""}

      <div class="resetline"><button id="resetBtn">Change start date / reset progress</button></div>
    </div>`;

  document.getElementById("prevBtn").onclick = () => { viewIndex = Math.max(0, idx-1); render(); };
  document.getElementById("nextBtn").onclick = () => { viewIndex = Math.min(TOTAL_DAYS-1, idx+1); render(); };
  document.getElementById("todayBtn").onclick = () => { viewIndex = clampIdx(rawToday); render(); };
  const jt = document.getElementById("jumpTodayBtn");
  if(jt) jt.onclick = () => { viewIndex = clampIdx(rawToday); render(); };
  document.getElementById("resetBtn").onclick = doReset;
  app.querySelectorAll("[data-goto]").forEach(b=>{
    b.onclick = () => { viewIndex = parseInt(b.dataset.goto,10); render(); };
  });
  app.querySelectorAll("[data-task]").forEach(inp=>{
    inp.onchange = () => setCheck(idx, parseInt(inp.dataset.task,10), inp.checked);
  });
}

function clampIdx(i){ return Math.max(0, Math.min(TOTAL_DAYS-1, i)); }
function doReset(){
  if(!confirm("Reset your start date and all checked-off progress?")) return;
  startDate = null; progress = {}; viewIndex = null;
  try{ localStorage.removeItem(SK); localStorage.removeItem(PK); }catch(e){}
  render();
}

render();
</script>
</body>
</html>
